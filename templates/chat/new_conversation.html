{% extends "base.html" %}

{% block title %}New Conversation{% endblock %}

{% block content %}
<h2>Start a new conversation</h2>
<form method="post">
    {% csrf_token %}
    <label for="title">Title (optional)</label>
    <input type="text" id="title" name="title">

    <label for="initial_question">Initial question</label>
    <textarea id="initial_question" name="initial_question" rows="3" required></textarea>

    <button type="submit">Start</button>
</form>
{% endblock %}

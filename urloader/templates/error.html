{% extends "base.html" %}

{% block title %}Error{% endblock %}

{% block content %}
<div class="container">
    <h1>{{ error_title }}</h1>
    <p class="subtitle">{{ error_message }}</p>

    {% if error_detail and error_detail != error_message %}
    <div class="result-card">
        <p style="color: var(--muted); font-size: 0.9rem;">{{ error_detail }}</p>
    </div>
    {% endif %}

    <a href="{% url 'index' %}" class="btn-back">← Back to home</a>
</div>
{% endblock %}

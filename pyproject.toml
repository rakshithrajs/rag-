[project]
name = "url-summarizer"
version = "0.2.0"
description = "Django URL summarizer powered by LangChain and Ollama"
requires-python = ">=3.10"
dependencies = [
    "django>=5.1,<5.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "langchain>=0.3,<0.4",
    "langchain-ollama>=0.2",
    "langchain-community>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "django-extensions>=4.0",
]

[tool.setuptools]
packages = ["url", "urloader"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "url.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
